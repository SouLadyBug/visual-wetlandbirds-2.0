[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-wetlandbirds"
version = "0.1.0"
description = "Reproducible analysis and computer-vision benchmark for the Visual WetlandBirds dataset"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "Pillow>=10.0",
  "opencv-python>=4.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
vision = ["torch>=2.1", "torchvision>=0.16"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
